services:
  doorcam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: halloween-doorcam
    restart: unless-stopped
    env_file:
      - .env
    devices:
      # Video capture device (mapped from CAMERA_DEVICE in .env, defaults to /dev/video2)
      - "${CAMERA_DEVICE:-/dev/video2}:${CAMERA_DEVICE:-/dev/video2}"
      # Sound devices for microphone input and speaker output (ALSA)
      - "/dev/snd:/dev/snd"
    group_add:
      - audio
      - video
    # Allows container to reach local host services (e.g., local Ollama on host.docker.internal:11434)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist Whisper and huggingface/torch model cache across container rebuilds
      - ./cache:/root/.cache
      # Mount script and riddles for faster iteration without requiring full rebuild
      - ./doorcam.py:/app/doorcam.py
      - ./spooky_fx.py:/app/spooky_fx.py
      - ./riddles.txt:/app/riddles.txt
      - ./greetings.txt:/app/greetings.txt
      - ./generate_fx.py:/app/generate_fx.py
      # Persist generated and cached TTS audio files
      - ./audio_cache:/app/audio_cache
      # Persist motion-detected frame screenshots
      - ./detected_frames:/app/detected_frames
      # Mount PulseAudio/PipeWire socket for Bluetooth and host audio routing
      - "${PULSE_SOCKET:-/run/user/1000/pulse/native}:/tmp/pulse-socket"
    # Uncomment network_mode if you prefer native host networking on Linux:
    # network_mode: "host"

  skeleton:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: halloween-skeleton
    command: ["python3", "skeleton_service.py"]
    profiles:
      - skeleton
    restart: unless-stopped
    env_file:
      - .env
    devices:
      # Video capture device (mapped from CAMERA_DEVICE in .env, defaults to /dev/video2)
      - "${CAMERA_DEVICE:-/dev/video2}:${CAMERA_DEVICE:-/dev/video2}"
      # Sound devices for microphone input and speaker output (ALSA)
      - "/dev/snd:/dev/snd"
    group_add:
      - audio
      - video
    # Allows container to reach local host services (e.g., local Ollama on host.docker.internal:11434)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist Whisper and huggingface/torch model cache across container rebuilds
      - ./cache:/root/.cache
      # Mount script and greetings for faster iteration without requiring full rebuild
      - ./skeleton_service.py:/app/skeleton_service.py
      - ./skeleton_greetings.txt:/app/skeleton_greetings.txt
      - ./spooky_fx.py:/app/spooky_fx.py
      - ./generate_fx.py:/app/generate_fx.py
      # Persist generated and cached TTS audio files
      - ./audio_cache:/app/audio_cache
      # Persist motion-detected frame screenshots
      - ./detected_frames:/app/detected_frames
      # Mount PulseAudio/PipeWire socket for Bluetooth and host audio routing
      - "${PULSE_SOCKET:-/run/user/1000/pulse/native}:/tmp/pulse-socket"
    # Uncomment network_mode if you prefer native host networking on Linux:
    # network_mode: "host"
